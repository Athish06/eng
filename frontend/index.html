<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chummah — Local AI English fluency trainer with real-time corrections and voice.">
    <title>Chummah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MAIN APP -->
    <div class="app-container" id="app">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                </button>
                <button class="new-chat-btn" id="newChatBtn" title="New Chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <span>New chat</span>
                </button>
            </div>
            <div class="sessions-list" id="sessionsList"></div>
            <div class="sidebar-footer">
                <div class="mode-selector" id="modeSelector">
                    <button class="mode-btn active" data-mode="casual" id="modeCasual">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                        Casual
                    </button>
                    <button class="mode-btn" data-mode="interview" id="modeInterview">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
                        Interview
                    </button>
                </div>
                <div class="model-status" id="modelStatus">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="statusText">connecting...</span>
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main-content" id="mainContent">
            <header class="mobile-header" id="mobileHeader">
                <button class="hamburger-btn" id="hamburgerBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <h1 class="app-title">chummah</h1>
                <button class="new-chat-mobile" id="newChatMobile">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </header>

            <div class="chat-container" id="chatContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-logo">

                        <h2>chummah</h2>
                        <p class="welcome-subtitle">english fluency companion</p>
                    </div>
                    <div class="welcome-prompts">
                        <button class="prompt-card" data-prompt="Hi! I want to practice for a job interview. Can you help me?">
                            <span class="prompt-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg></span>
                            <span class="prompt-text">Practice job interview</span>
                        </button>
                        <button class="prompt-card" data-prompt="Let's have a casual conversation about technology.">
                            <span class="prompt-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span>
                            <span class="prompt-text">Casual conversation</span>
                        </button>
                        <button class="prompt-card" data-prompt="I want to improve my English vocabulary. Let's talk about my daily routine.">
                            <span class="prompt-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg></span>
                            <span class="prompt-text">Improve vocabulary</span>
                        </button>
                        <button class="prompt-card" data-prompt="Help me practice describing my projects and technical skills.">
                            <span class="prompt-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></span>
                            <span class="prompt-text">Describe projects</span>
                        </button>
                    </div>
                </div>
                <div class="messages-area" id="messagesArea"></div>
            </div>

            <div class="input-bar-wrapper" id="inputBarWrapper">
                <div class="input-bar" id="inputBar">
                    <button class="mic-btn" id="micBtn" title="Voice input">
                        <svg class="mic-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                        <svg class="mic-stop-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    </button>
                    <div class="input-wrapper">
                        <textarea id="messageInput" placeholder="say something..." rows="1" autocomplete="off"></textarea>
                        <div class="recording-indicator hidden" id="recordingIndicator">
                            <span class="recording-dot"></span>
                            <span>listening...</span>
                        </div>
                    </div>
                    <button class="send-btn" id="sendBtn" title="Send" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                    <button class="stop-btn hidden" id="stopBtn" title="Stop">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    </button>
                </div>
                <div class="input-footer">
                    <span class="tts-toggle active" id="ttsToggle" title="Toggle voice">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
                        <span id="ttsLabel">voice on</span>
                    </span>
                    <span class="input-hint">enter send / shift+enter newline / click mic for voice</span>
                </div>
            </div>
        </main>
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
